# Sequence stub: Boreas (boreas-objects-v1), 50-frame moderate-traffic window.
# Navtech 360-degree scanning radar, range-azimuth only (D=1), annotated.
# Timestamps 1598988079915263-1598988092163459 (50 frames @ 4 Hz, 12.2 s).
# 7.0 moving cars/frame (5-10), 17 dynamic tracks, 128 m of ego travel.
#
# Preprocessing: python -m dyrad.preprocessing.boreas prepare-window --window win55_104
# Navtech intensities are log-compressed counts: power = 10^(u/20).
#
# Poses are recentred on the mean translation of the window (see
# <seq_dir>/recentre.json) so that world coordinates fit float32 precision;
# raw UTM northings (~4.8e6 m) do not.
# The clamp track_max_displacement_m bounds each object reflector's displacement
# dx = R(t) mu + P(t) - mu, which is dominated by the object's world position P(t),
# so it must exceed the objects' world-coordinate extent (|x|, |y| <= 112 m here).
dataset: boreas
seq_dir: data/boreas_processed/boreas_obj_win55_104_rc
rad_tensors_dir: data/boreas_processed/boreas_obj_win55_104_rc/rad_tensors
radar_poses_dir: data/boreas_processed/boreas_obj_win55_104_rc/poses_can
ego_vel_npy: data/boreas_processed/boreas_obj_win55_104_rc/ego_vel.npy
seq_name: BOREAS-OBJ-WIN55-104
object_label_path: data/boreas_processed/boreas_obj_win55_104_rc/labels_boreas.csv
frame_start: 0
frame_end: 50
track_max_displacement_m: 300.0
render_frame_idxs: [0, 25, 49]
render_save_steps: [0, 2000, 10000]
