# Sequence stub: Boreas (boreas-objects-v1), 50-frame sparse-traffic window.
# Navtech 360-degree scanning radar, range-azimuth only (D=1), annotated.
# Timestamps 1598987711906340-1598987724156947 (50 frames @ 4 Hz, 12.25 s).
# 3.9 moving cars/frame, 7 dynamic tracks; ego path (130 m, 10.6 m/s) matches
# boreas_obj_win55_104 to ~1%, so the two differ mainly in traffic density.
#
# Preprocessing: python -m dyrad.preprocessing.boreas prepare-window --window sparse4
# Navtech intensities are log-compressed counts: power = 10^(u/20).
#
# Poses are recentred on the mean translation of the window (see
# <seq_dir>/recentre.json) so that world coordinates fit float32 precision;
# raw UTM northings (~4.8e6 m) do not.
# The clamp track_max_displacement_m bounds each object reflector's displacement
# dx = R(t) mu + P(t) - mu, which is dominated by the object's world position P(t),
# so it must exceed the objects' world-coordinate extent (|x|, |y| <= 125 m here).
dataset: boreas
seq_dir: data/boreas_processed/boreas_obj_sparse4_rc
rad_tensors_dir: data/boreas_processed/boreas_obj_sparse4_rc/rad_tensors
radar_poses_dir: data/boreas_processed/boreas_obj_sparse4_rc/poses_can
ego_vel_npy: data/boreas_processed/boreas_obj_sparse4_rc/ego_vel.npy
seq_name: BOREAS-OBJ-SPARSE4
object_label_path: data/boreas_processed/boreas_obj_sparse4_rc/labels_boreas.csv
frame_start: 0
frame_end: 50
track_max_displacement_m: 300.0
render_frame_idxs: [0, 25, 49]
render_save_steps: [0, 2000, 10000]
