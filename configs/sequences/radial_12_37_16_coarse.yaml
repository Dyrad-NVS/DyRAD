# RADIal sequence 12_37_16 processed as the coarse sensor configuration
# (128 of 512 ADC samples per chirp, 128 of 256 chirps: 4x coarser range, 2x coarser
# Doppler, same azimuth grid and Doppler wrap period). Used for the sensor-configuration
# transfer experiment (paper Sec. 4.3 / E). Same window, poses and labels as the native sequence.
dataset: radial
seq_dir: data/radial_processed/seq_12_37_16_coarse
rad_tensors_dir: data/radial_processed/seq_12_37_16_coarse/rad_tensors
radar_poses_dir: data/radial_processed/seq_12_37_16_coarse/poses_can
ego_vel_npy: data/radial_processed/seq_12_37_16_coarse/ego_vel_can.npy
seq_name: RECORD@2020-11-22_12.37.16
frame_start: 205
frame_end: 265
track_max_displacement_m: 9200.0  # clamp on each reflector's displacement, dominated by its object's world position P; must exceed |P|
render_frame_idxs: [0, 72, 143, 214, 286, 358, 429]
num_range_bins: 128
num_doppler_bins: 8
range_crop_first: 4
range_crop_last: 12
radar_doppler_max_mps: 0.6738
doppler_roll_bins: 4
lin_hi_global: 0.0  # per-sequence hi (robust p99.9 of the train GT); lo stays the native lin_lo_global
