# Synthetic scene spec for dyrad/synthetic/generate_scene.py (format:
# dyrad/synthetic/scene_spec.py). World frame: +X = ego forward, +Y = left, +Z = up;
# the ego starts at the origin. `ego` sets the base path (speed m/s, yaw rate deg/s,
# longitudinal acceleration m/s^2); each `elements` entry is a reflector group
# (barrier, wall, pole, corner, car) with positions in m, `rcs` a [lo, hi] uniform
# range, and car `velocity`/`accel` in world m/s and m/s^2. Element order fixes the
# RNG draws, so reordering elements changes the scene.
# Doppler values below are boresight radial velocities (receding-positive) and
# their wrapped bin on the 16-bin, 0.1123 m/s axis (period 1.7968 m/s, DC at bin 0).
description: >-
  Fast open road with almost no static structure — a handful of widely spaced
  roadside poles and one fast oncoming vehicle. The stress case for
  initialization and for novel views: with little static support the radar cloud
  seeds sparsely, so this scene asks whether the geometry holds up off-path when
  there is nothing dense to anchor it to. The oncoming closing speed also puts
  Doppler deep into wrap.

# Ego 31.6 m/s, oncoming at -25 m/s world -> v_r = -56.6 m/s, about 31.5 periods
# of the 1.7968 m/s DDMA window (wrapped bin ~8.0), so the mover's bin is
# determined entirely by the wrap.
ego:
  speed_mps: 31.6
  yaw_rate_deg_s: 0.0
  accel_mps2: 0.0

elements:
  # Sparse roadside furniture only, no continuous barrier. Spacing is
  # ~20 m, against 3 m for a guardrail's posts.
  - kind: pole
    label: post_r1
    x: 25.0
    y: -8.0
    rcs: [0.5, 0.9]
    height_m: 4.0

  - kind: pole
    label: post_r2
    x: 46.0
    y: -8.0
    rcs: [0.5, 0.9]
    height_m: 4.0

  - kind: pole
    label: post_r3
    x: 68.0
    y: -8.0
    rcs: [0.5, 0.9]
    height_m: 4.0

  - kind: pole
    label: post_r4
    x: 89.0
    y: -8.0
    rcs: [0.5, 0.9]
    height_m: 4.0

  - kind: pole
    label: post_l1
    x: 34.0
    y: 9.5
    rcs: [0.5, 0.9]
    height_m: 4.0

  - kind: pole
    label: post_l2
    x: 76.0
    y: 9.5
    rcs: [0.5, 0.9]
    height_m: 4.0

  # One bright distant reflector so the scene is not entirely dim.
  - kind: corner
    label: distant_sign
    x: 95.0
    y: -7.0
    rcs: [4.0, 6.0]

  # Fast oncoming vehicle in the opposing lane.
  - kind: car
    label: car_oncoming_fast
    x0: 90.0
    y0: 4.5
    velocity: [-25.0, 0.0, 0.0]
    rcs: [12.0, 18.0]
