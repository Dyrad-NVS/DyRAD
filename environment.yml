# DyRAD conda environment. Install steps (including the gsplat CUDA build): see README: Installation.
#
# The gcc pin matters: PyTorch's CUDAExtension passes $CC to nvcc as -ccbin, and
# nvcc 11.8 rejects gcc >= 12. Keeping gcc 11 inside the env makes the build work.
name: dyrad
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
dependencies:
  - python=3.10
  - cuda-toolkit=11.8.0        # nvcc for the gsplat radar kernels
  - gcc_linux-64=11.4.0
  - gxx_linux-64=11.4.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.4.0+cu118
      - torchvision==0.19.0+cu118  # lpips needs it
      - -r requirements.txt
